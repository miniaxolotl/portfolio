name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-cd:
    name: CI/CD
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run build
        run: bun run build

      # Note: Deployment is automatically handled by Vercel
      # Vercel will deploy automatically when code is pushed to the main branch
      - name: Deploy to Vercel
        run: echo "Deployment is automatically handled by Vercel integration"
